<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo de Previsão do Tempo utilizando a API Open-Meteo.">
    <title>Previsão do Tempo</title>
    <!-- Utilizando a fonte moderna 'Inter' do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cartão de Busca: Exibido inicialmente -->
        <main class="card" id="search-card">
            <h1 class="card-title">Previsão do Tempo</h1>
            <form id="search-form">
                <div class="input-group">
                    <input type="text" id="city-input" placeholder="Digite o nome da cidade" required aria-label="Nome da cidade">
                    <button type="submit" id="search-button">Buscar</button>
                </div>
                <!-- Mensagem de erro ficará oculta por padrão -->
                <div id="error-message" class="error-message hidden" role="alert">
                    Cidade não encontrada. Tente novamente.
                </div>
            </form>
        </main>

        <!-- Cartão de Resultado: Exibido após a busca -->
        <main class="card hidden" id="result-card">
            <div class="temperature-wrapper">
                <div class="temperature-display">
                    <span id="temperature">--</span>º
                </div>
            </div>
            <div class="location-display" id="location-name">
                --
            </div>
            <!-- Botão com ícone para retornar à busca -->
            <button id="home-button" class="icon-button" aria-label="Voltar para a busca">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
        </main>
    </div>

    <!-- Script contendo a lógica de busca e consumo da API -->
    <script src="api.js"></script>
</body>
</html>
